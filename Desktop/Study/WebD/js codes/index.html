<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Functions Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .quiz-container {
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .question {
            margin-bottom: 15px;
        }
        .answer {
            display: block;
            margin: 10px 0;
            padding: 10px;
            background-color: #e1e1e1;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        .answer:hover {
            background-color: #d1d1d1;
        }
        .answer.correct {
            background-color: #90ee90;
        }
        .answer.wrong {
            background-color: #ffcccb;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
        }
        .nav-buttons button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        .nav-buttons button:disabled {
            background-color: #ddd;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="nav-buttons">
            <button id="prev" onclick="prevQuestion()" disabled>Previous</button>
            <button id="next" onclick="nextQuestion()">Next</button>
        </div>
    </div>

    <script>
    // quiz.js

// Quiz questions and answers
const quizData = [
    {
        question: "What is the purpose of the 'return' statement in a function?",
        options: [
            "To display a message",
            "To terminate the function",
            "To specify the value that the function returns",
            "To pass control back to the calling function"
        ],
        correct: 2
    },
    {
        question: "Which of the following is a correct way to declare a function in JavaScript?",
        options: [
            "function myFunction() {}",
            "var myFunction = function() {}",
            "let myFunction = () => {}",
            "All of the above"
        ],
        correct: 3
    },
    {
        question: "How can you pass parameters to a function in JavaScript?",
        options: [
            "Using the 'arguments' object",
            "Listing them in the function definition",
            "Both of the above",
            "None of the above"
        ],
        correct: 2
    },
    {
        question: "What does the 'this' keyword refer to in a method defined within an object?",
        options: [
            "The global object",
            "The parent object",
            "The object itself",
            "It depends on the context"
        ],
        correct: 2
    },
    {
        question: "How do you create an immediately invoked function expression (IIFE)?",
        options: [
            "function() {}",
            "(function() {})()",
            "var myFunc = function() {}",
            "function myFunc() {}"
        ],
        correct: 1
    }
];

let currentQuestionIndex = 0;
let score = 0;

// Initialize quiz
function loadQuestion() {
    const questionElement = document.getElementById('question');
    const answersElement = document.getElementById('answers');

    // Clear previous options
    answersElement.innerHTML = '';

    // Load current question
    const currentQuestion = quizData[currentQuestionIndex];
    questionElement.textContent = currentQuestion.question;

    // Load options
    currentQuestion.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.textContent = option;
        button.classList.add('answer');
        button.onclick = () => checkAnswer(index, button);
        answersElement.appendChild(button);
    });

    // Manage navigation buttons
    document.getElementById('prev').disabled = currentQuestionIndex === 0;
    document.getElementById('next').disabled = currentQuestionIndex === quizData.length - 1;
}

// Check answer and update score
function checkAnswer(selectedIndex, button) {
    const currentQuestion = quizData[currentQuestionIndex];
    const isCorrect = selectedIndex === currentQuestion.correct;

    // Disable all options
    const buttons = document.querySelectorAll('.answer');
    buttons.forEach(btn => btn.disabled = true);

    // Mark selected answer
    button.classList.add(isCorrect ? 'correct' : 'wrong');

    // Update score
    if (isCorrect) {
        score++;
    }
}

// Navigate to next question
function nextQuestion() {
    if (currentQuestionIndex < quizData.length - 1) {
        currentQuestionIndex++;
        loadQuestion();
    }
}

// Navigate to previous question
function prevQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        loadQuestion();
    }
}

// Load the first question
window.onload = loadQuestion;

    </script>
</body>
</html>
